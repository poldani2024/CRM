
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cuentas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="appShell"></div>

  <!-- Modal Nueva Cuenta -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">Nueva Cuenta</div>
        <button class="btn btn-ghost" id="btnCloseModal">✕</button>
      </div>

      <div class="spacer"></div>

      <div class="grid2">
        <div class="field">
          <label>Nombre</label>
          <input id="a_name" placeholder="Ej: ACME S.A." />
        </div>

        <div class="field">
          <label>Tipo de cliente</label>
          <select id="a_type">
            <option value="bank">Banco</option>
            <option value="building">Edificio</option>
            <option value="warehouse">Depósito</option>
            <option value="store">Local</option>
            <option value="plant">Planta</option>
          </select>
        </div>

        <div class="field">
          <label>Frecuencia de visita (unidad)</label>
          <input id="a_visitUnit" type="number" min="1" step="1" value="1" />
        </div>

        <div class="field">
          <label>Frecuencia de visita (período)</label>
          <select id="a_visitPeriod">
            <option value="day">Día</option>
            <option value="week">Semana</option>
            <option value="month">Mes</option>
            <option value="year">Año</option>
          </select>
        </div>

        <div class="field">
          <label>Estado (board)</label>
          <select id="a_stage">
            <option value="prospect">Prospecto</option>
            <option value="offer_sent">Oferta enviada</option>
            <option value="negotiation">Negociación</option>
            <option value="account_active">Cuenta activa</option>
            <option value="account_inactive">Cuenta inactiva</option>
            <option value="closed">Cerrado</option>
          </select>
        </div>

        <div class="field">
          <label>Teléfono</label>
          <input id="a_phone" placeholder="Ej: +549341..." />
        </div>

        <div class="field">
          <label>Cantidad Planilla</label>
          <input id="a_sheetCount" type="number" min="0" step="1" value="0" />
        </div>

        <div class="field">
          <label>Cantidad Certificado</label>
          <input id="a_certificateCount" type="number" min="0" step="1" value="0" />
        </div>

        <div class="field" style="display:flex; align-items:flex-end;">
          <label class="row" style="gap:8px; align-items:center; margin:0;">
            <input id="a_mailNotice" type="checkbox" />
            <span>Aviso x Mail</span>
          </label>
        </div>

        <div class="field" style="grid-column:1/-1;">
          <label>Comentarios</label>
          <textarea id="a_notes" placeholder="Notas internas..."></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" id="btnCancel">Cancelar</button>
        <button class="btn btn-primary" id="btnSave">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/accounts.js?v=20260222"></script>
</body>
</html>
